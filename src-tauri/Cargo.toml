[package]
name = "s-read-txt"
version = "0.0.1-beta"
description = "S-Read-TXT — 极简 Windows TXT 阅读器（可切换编辑）"
authors = ["stop666two"]
edition = "2021"
license = "MIT"
# Rust 最低版本：Tauri 2 要求 ≥1.77.2；本机开发使用 1.96
rust-version = "1.77.2"

[dependencies]
# Tauri 框架（精确锁定；禁用范围符是项目规则）
# image-png：运行期解码 PNG 窗口图标（128px 源，覆盖任务栏与 Alt-Tab 两种尺寸）
# custom-protocol 必须常开（永久修复「裸 cargo 构建的 exe 指向 localhost:1420」）：
#   Tauri 以 `custom-protocol` feature 区分打包模式（内嵌前端资源）与开发模式（连 devUrl）。
#   `tauri build` 由 CLI 自动启用；裸 `cargo build`/`cargo test` 不会——产物被打回开发语义，
#   启动后显示「localhost 拒绝连接」。固化此 feature 后，任何方式的编译产物都可独立运行。
#   代价：`tauri dev`（HMR 开发服务器）不适用于本项目（本项目流程 = tauri build + CDP 验证）。
tauri = { version = "=2.12.1", features = ["custom-protocol", "image-png"] }
# 原生文件/目录对话框（打开文件、选择数据目录、消息框）
tauri-plugin-dialog = "=2.8.1"
# 序列化/反序列化：IPC 载荷、配置、历史、会话
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# 内存映射读取：超大文件按需分页，禁止整读文件
memmap2 = "=0.9.11"
# 高速字节搜索：换行扫描（构建稀疏行索引）
memchr = "=2.8.3"
# 编码解码：WHATWG 全量编码族（UTF-8/16、GB18030、Big5、Shift_JIS、EUC-KR、1252 等）
encoding_rs = "=0.8.42"
# 编码自动检测：BOM 缺失时的启发式检测（GB18030 友好）
chardetng = "=1.0.0"
# 错误类型派生：统一错误模型
thiserror = "=2.0.21"
# UTC 时间与 RFC3339：历史时间戳、日志时间戳
time = { version = "=0.3.55", features = ["formatting", "parsing", "macros"] }
# 日志门面：本项目自实现轻量 JSON 行日志写入（无第三方日志后端依赖）
# features 说明：`alloc` 提供 `set_boxed_logger`（安装全局 logger 必需）；`std` 提供标准库集成
log = { version = "=0.4.34", features = ["std", "alloc"] }
tauri-plugin-clipboard-manager = "=2.4.1"
# 用户正则搜索（替换 v2）：线性时间无回溯（100MB 文件安全）；替换支持 $1 捕获展开
regex = "=1.13.1"

[build-dependencies]
# Tauri 构建期：校验配置、生成权限 schema 与资源
tauri-build = { version = "=2.7.1", features = [] }

[target.'cfg(windows)'.dependencies]
# Windows 安全/外壳 API：数据目录权限的一次性初始化（提权助手）。
# 用途：查询当前用户 SID（ConvertSidToStringSidW）、检测令牌提权状态、
#       以 runas 拉起提权助手（建目录 + icacls 授权）、启动失败原生消息框。
# 仅 Windows 编译；GNU 与 MSVC 工具链均由 windows-targets 提供导入库。
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# 单元测试：临时目录（原子写、数据目录回退等场景）
tempfile = "=3.27.0"

[profile.release]
# 体积优先：满足安装包 <10MB 红线（配合 LTO + strip）
opt-level = "s"
lto = true
codegen-units = 1
# 无 unwind 表：减小体积；panic 即进程终止（桌面应用可接受）
panic = "abort"
# 去除符号表
strip = true
